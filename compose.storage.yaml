services:
  object-storage:
    image: chrislusf/seaweedfs:4.48
    command: mini -dir=/data -s3.config=/config/s3.json -ip=0.0.0.0 -admin.ui=false -webdav=false
    working_dir: /data
    ports:
      - "127.0.0.1:9000:8333"
    volumes:
      - montepica_storage_data_v3:/data
      - ./.local/storage/s3.json:/config/s3.json:ro
    restart: unless-stopped

volumes:
  montepica_storage_data_v3:
