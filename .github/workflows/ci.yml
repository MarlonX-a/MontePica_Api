name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validar backend por apartado
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: montepica_ci
          POSTGRES_PASSWORD: montepica_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U montepica_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24 y caché de npm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Validar compilación TypeScript y NestJS
        run: npm run build

      - name: Validar lint
        run: npm run lint

      - name: Pruebas unitarias, arquitectura y cobertura
        run: npm run test:cov -- --coverage.reporter=text --coverage.reporter=lcov

      - name: Pruebas E2E con PostgreSQL
        env:
          RUN_POSTGRES_E2E: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_USERNAME: montepica_ci
          DB_PASSWORD: montepica_ci_only
        run: npm run test:e2e

      - name: Guardar cobertura LCOV
        uses: actions/upload-artifact@v4
        with:
          name: backend-lcov
          path: coverage/lcov.info
          if-no-files-found: error
