name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validar backend por apartado
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24 y caché de npm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar compilación TypeScript y NestJS
        run: npm run build

      - name: Validar lint
        run: npm run lint

      - name: Login y autenticación
        run: npm run test -- src/auth/auth.service.spec.ts

      - name: Permisos y autorización
        run: npm run test -- src/auth/permissions.guard.spec.ts

      - name: Administración de usuarios, roles y permisos
        run: npm run test -- src/admin/admin.service.spec.ts

      - name: Catálogo público
        run: npm run test -- src/catalog/catalog.service.spec.ts

      - name: Configuración y variables de entorno
        run: npm run test -- src/config/environment.validation.spec.ts

      - name: API E2E - salud, contratos de autenticación y rutas administrativas
        run: npm run test:e2e
