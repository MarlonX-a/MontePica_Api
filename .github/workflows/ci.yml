name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validar backend por apartado
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24 y caché de npm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Validar compilación TypeScript y NestJS
        run: npm run build

      - name: Validar lint
        run: npm run lint

      - name: Pruebas unitarias y límites de arquitectura
        run: npm test

      - name: API E2E - salud, contratos de autenticación y rutas administrativas
        run: npm run test:e2e
